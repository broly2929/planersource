# Installation par Docker (D-138 (3)). Variables dans .env (modèle : .env.production.example).
services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-planersource}
      POSTGRES_USER: ${POSTGRES_USER:-planersource}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
    volumes:
      - donnees:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-planersource}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-planersource}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET manquant dans .env}
      PORT: '8080'
    ports:
      - '${PORT:-8080}:8080'
    depends_on:
      db:
        condition: service_healthy

volumes:
  donnees:
